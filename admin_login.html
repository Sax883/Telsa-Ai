<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TESLAAI Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); width: 300px; }
        h2 { text-align: center; color: #333; }
        input[type="email"], input[type="password"] { width: 100%; padding: 10px; margin: 8px 0; display: inline-block; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 14px 20px; margin: 8px 0; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #0056b3; }
        #message { text-align: center; color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Admin Panel Login</h2>
        <form id="adminLoginForm">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Log In</button>
            <p id="message"></p>
        </form>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const messageElement = document.getElementById('message');

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success && data.user && data.user.isAdmin) {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminEmail', data.user.email || email);
                    messageElement.style.color = 'green';
                    messageElement.textContent = 'Login successful. Redirecting...';
                    window.location.href = 'admin_dashboard.html';
                } else {
                    if (response.ok && data.success && (!data.user || !data.user.isAdmin)) {
                        messageElement.style.color = 'red';
                        messageElement.textContent = 'This account is not an admin account.';
                        return;
                    }
                    messageElement.style.color = 'red';
                    messageElement.textContent = data.message || 'Login failed.';
                }
            } catch (error) {
                console.error('Login error:', error);
                messageElement.style.color = 'red';
                messageElement.textContent = 'An error occurred during login.';
            }
        });
    </script>
</body>
</html>
