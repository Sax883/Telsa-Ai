<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESLAAI Admin Terminal - Client Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007BFF; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        input[type="number"] { padding: 8px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; width: 120px; }
        button { padding: 8px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #3e8f42; }
        .status-message { margin-top: 15px; padding: 10px; border-radius: 4px; font-weight: bold; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        #unauthorized-message { color: #cc0000; font-size: 1.2em; text-align: center; padding: 50px; display: none; }
    </style>
</head>
<body>

    <div class="container" id="admin-container" style="display: none;">
        <h1>Admin Client Balance Management 🏦</h1>

        <div id="connection-status" class="status-message error">Connecting...</div>

        <h2>Registered Clients</h2>
        
        <table id="client-table">
            <thead>
                <tr>
                    <th>ID/Email</th>
                    <th>Name</th>
                    <th>Current Balance ($)</th>
                    <th>Set New Balance ($)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>

        <div id="admin-message" class="status-message"></div>
    </div>
    
    <div id="unauthorized-message">
        ACCESS DENIED. Invalid Credentials.
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- Admin Credentials (Must match server.js) ---
        const ADMIN_USERNAME = 'tesla_ai';
        const ADMIN_PASSWORD = '@David081';
        
        // Adjust this if your server is not running on the same domain/port
        const SERVER_URL = `http://localhost:10000`; 

        const adminContainer = document.getElementById('admin-container');
        const unauthorizedMessage = document.getElementById('unauthorized-message');
        const connectionStatus = document.getElementById('connection-status');
        const clientTableBody = document.querySelector('#client-table tbody');
        const adminMessage = document.getElementById('admin-message');
        let socket; // Define socket globally

        // --- Authentication Function ---
        function authenticateAdmin() {
            const user = prompt("Enter Admin Username:");
            if (!user) {
                 unauthorizedMessage.style.display = 'block';
                 return;
            }
            
            const pass = prompt("Enter Admin Password:");
            
            if (user === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
                adminContainer.style.display = 'block';
                initializeSocketConnection();
            } else {
                unauthorizedMessage.style.display = 'block';
                alert("Invalid Username or Password.");
            }
        }
        
        // --- Initialize Socket.IO Connection ---
        function initializeSocketConnection() {
            // These parameters tell the server to treat this connection as admin
            const ADMIN_PARAMS = {
                query: {
                    isAdmin: 'true' 
                }
            };

            socket = io(SERVER_URL, ADMIN_PARAMS);

            // --- Socket.IO Handlers ---
            socket.on('connect', () => {
                connectionStatus.className = 'status-message success';
                connectionStatus.textContent = '✅ Connected as Admin. Loading client data...';
                socket.emit('requestAllClientData');
            });

            socket.on('disconnect', () => {
                connectionStatus.className = 'status-message error';
                connectionStatus.textContent = '❌ Disconnected. Please refresh.';
            });

            // 1. Receive all client data
            socket.on('allClientData', (clients) => {
                clientTableBody.innerHTML = ''; // Clear existing list
                
                // Filter out the admin account itself
                const nonAdminClients = clients.filter(c => !c.isAdmin);
                
                nonAdminClients.forEach(client => {
                    const row = clientTableBody.insertRow();
                    row.id = `client-row-${client.id}`;
                    
                    row.innerHTML = `
                        <td>${client.id}</td>
                        <td>${client.name}</td>
                        <td id="balance-${client.id}">$${(client.balance || 0).toFixed(2)}</td>
                        <td><input type="number" id="newBalance-${client.id}" placeholder="e.g. 1500.00" value="${(client.balance || 0).toFixed(2)}"></td>
                        <td><button onclick="updateAccount('${client.id}')">Update Balance</button></td>
                    `;
                });
                displayMessage('success', `Loaded ${nonAdminClients.length} client accounts.`);
            });

            // 2. Receive update confirmation
            socket.on('updateSuccess', (data) => {
                displayMessage('success', data.message);
                socket.emit('requestAllClientData'); 
            });

            // 3. Receive update error
            socket.on('updateError', (data) => {
                displayMessage('error', data.message);
            });
            
            // 4. Client's dashboard view is also listening for an update, but we can update the admin view here too
            socket.on('accountUpdated', (updatedUser) => {
                const balanceCell = document.getElementById(`balance-${updatedUser.id}`);
                if (balanceCell) {
                    balanceCell.textContent = `$${updatedUser.balance.toFixed(2)}`;
                    balanceCell.parentNode.style.backgroundColor = '#ccffcc'; 
                    setTimeout(() => {
                        balanceCell.parentNode.style.backgroundColor = '';
                        socket.emit('requestAllClientData'); 
                    }, 1500);
                }
            });
        }
        
        // --- Utility Functions ---
        function displayMessage(type, message) {
            adminMessage.className = `status-message ${type}`;
            adminMessage.textContent = message;
            setTimeout(() => {
                adminMessage.textContent = '';
                adminMessage.className = 'status-message';
            }, 5000);
        }

        // --- Client-Side Functions ---
        window.updateAccount = function(clientId) {
            if (!socket) return displayMessage('error', 'Socket not initialized.');
            
            const newBalanceInput = document.getElementById(`newBalance-${clientId}`);
            const newBalance = newBalanceInput.value;

            const parsedBalance = parseFloat(newBalance);
            if (isNaN(parsedBalance)) {
                return displayMessage('error', 'Please enter a valid number for the new balance.');
            }

            socket.emit('updateClientAccount', {
                clientId: clientId,
                newBalance: parsedBalance
            });
        };
        
        // Start the authentication flow when the page loads
        authenticateAdmin();

    </script>
</body>
</html>
