// NEW SCRIPT FOR login.html
<script>
    // *** IMPORTANT: CONFIRM YOUR LIVE CHAT SERVER URL ***
    const CHAT_SERVER_URL = "https://telsa-ai-chat-server.onrender.com"; 

    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault(); // Stop the form from submitting normally

        // 1. Get user input
        const emailInput = document.querySelector('input[type="email"]').value;
        const passwordInput = document.querySelector('input[type="password"]').value;
        const loginButton = document.querySelector('.auth-form button[type="submit"]');

        if (!emailInput || !passwordInput) {
            alert("Please enter both email and password.");
            return;
        }

        loginButton.textContent = 'Signing In...';
        loginButton.disabled = true;

        try {
            // 2. Send credentials to the server's new /api/login route
            const response = await fetch(`${CHAT_SERVER_URL}/api/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: emailInput, password: passwordInput })
            });

            const data = await response.json();

            if (data.success) {
                // 3. SUCCESS: Save the token and unique client ID to localStorage (cross-device fix)
                localStorage.setItem('userToken', data.token); // The token verifies the user on any device
                localStorage.setItem('clientId', data.clientId); // The unique ID for chat
                localStorage.setItem('telsa_userName', data.userName || data.clientId); // User's name for dashboard display
                
                alert('Login Successful! Redirecting to Dashboard.');
                window.location.href = 'dashboard.html'; // Redirect on success
            } else {
                // 4. FAILURE
                alert(data.message || "Login failed. Please check credentials.");
            }
        } catch (error) {
            console.error('Login error:', error);
            alert('Could not connect to the TelsaAi login server.');
        } finally {
            loginButton.textContent = 'Sign In';
            loginButton.disabled = false;
        }
    });
</script>
